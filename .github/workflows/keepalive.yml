name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 23 * * *'
    - cron: '*/10 0-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -sS -m 90 --retry 2 --retry-delay 30 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://emt-bot-1.onrender.com/healthz
