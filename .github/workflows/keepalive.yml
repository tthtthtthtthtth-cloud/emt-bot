yaml
name: Keep Render Awake

on:
  schedule:
    # cron 一律 UTC。台灣 = UTC+8
    # 台灣 07:00-07:59 → UTC 23:00-23:59
    - cron: '*/10 23 * * *'
    # 台灣 08:00-01:59 → UTC 00:00-17:59
    - cron: '*/10 0-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -sS --fail -m 90 --retry 2 --retry-delay 30 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://emt-bot-1.onrender.com/healthz
